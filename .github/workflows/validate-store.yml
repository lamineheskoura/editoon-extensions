name: validate-store

on:
  push:
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'catalog.json'
      - 'README.md'
      - 'EXTENSION_GUIDE.md'
      - 'prompts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'tools/**'
      - 'catalog.json'
      - 'README.md'
      - 'EXTENSION_GUIDE.md'
      - 'prompts/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate store structure and catalog
        shell: pwsh
        run: |
          .\tools\validate_store.ps1
          if (-not $?) { exit 1 }
      - name: Catalog is deterministic (rebuild produces no diff)
        shell: pwsh
        run: |
          .\tools\rebuild_catalog.ps1
          $rebuilt = (Get-Content -LiteralPath catalog.json -Raw | ConvertFrom-Json).extensions
          $committed = (git show HEAD:catalog.json | ConvertFrom-Json).extensions
          $props = @('slug','name','version','minApi','archiveUrl','iconUrl','sizeBytes','sha256')
          $d = Compare-Object $committed $rebuilt -Property $props
          if ($d) { $d | ForEach-Object { Write-Error "catalog.json stale: $($_.InputObject | ConvertTo-Json -Compress)" }; exit 1 }
          Write-Host 'catalog.json is up to date'
